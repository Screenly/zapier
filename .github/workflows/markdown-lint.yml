name: Markdown Lint

on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '**/.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.md'
      - '**/.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
